<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right , #667eea , #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;

        }

        .form-container{
            padding: 25px;
            border-radius: 12px;
            background: white;
            width: 300px;
        }

        h2{
            text-align: center;
            margin: 20px;
        }

        input{
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
        }

        button{
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 8px;

        }

        #responseMsg{
            margin-top: 15px;
            text-align: center;
            color: green;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Register</h2>
        <form id="register-form">

            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="password" required>

            <button type="submit">Register</button>
        </form>

        <p id="responseMsg"></p>
    </div>

    <script>

        document.getElementById('register-form').addEventListener('submit', async function(e){       
        e.preventDefault() // Prevent the form to reload
        const name = document.getElementById('name').value.trim() //.trim()- To remove the Extra whitespaces
        const email = document.getElementById('email').value.trim()
        const password = document.getElementById('password').value

        if(!name || !email || !password){
            alert('All Field are required')
            return;
        }
        

        //Connecting Backend
         const response = await fetch('https://localhost:3000/register' , {
            method:'POST',
            header:{'Content-Type':'application/json'},
            body:JSON.stringify({name,email,password})
        });

        
        const data = await response.json()

        document.getElementById('responseMsg').innerText = data.message;
        
        
    })
    </script>
</body>
</html>
