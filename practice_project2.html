<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Resham Weather App</title>

<style>
    
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins',sans-serif;
    }

    body{
        min-height:100%;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        background:linear-gradient(135deg,#1e3c72,#2a5298);
        transition:1s;
        overflow:auto;
    }

/* Animated Background */

    body::before{
        content:'';
        position:absolute;
        width:200%;
        height:200%;
        background:radial-gradient(circle,rgba(255,255,255,0.08) 10%,transparent 10%);
        background-size:50px 50px;
        animation:bgMove 20s linear infinite;
    }

    @keyframes bgMove{
        100%{
        transform:translate(-200px,-200px);}
    }

/* Main Card */

    .container{
        position:relative;
        width:80%;
        padding:30px;
        border-radius:30px;
        background:rgba(255,255,255,0.1);
        backdrop-filter:blur(18px);
        border:1px solid rgba(255,255,255,0.2);
        box-shadow:0 8px 32px rgba(0,0,0,0.35);
        text-align:center;
        color:white;
        z-index:1;
        animation:fadeIn 1s ease;
        padding-top: 30px;
    
    }

    @keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
    }

    .title{
        font-size:32px;
        font-weight:700;
        margin-bottom:20px;
    }

/* Search */

    .search-box{
        display:flex;
        gap:10px;
        margin-bottom:25px;
    }

    .search-box input{
        flex:1;
        padding:14px;
        border:none;
        outline:none;
        border-radius:15px;
        background:rgba(255,255,255,0.2);
        color:white;
        font-size:16px;
    }

    .search-box input::placeholder{
        color:#eee;
    }

    .search-box button{
        padding:14px 18px;
        border:none;
        border-radius:15px;
        cursor:pointer;
        background:white;
        color:#333;
        font-weight:600;
        transition:0.3s;
    }

    .search-box button:hover{
        transform:scale(1.05);
    }

/* Weather */

    .weather-icon{
        width:120px;
        animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
        0%,100%{
        transform:translateY(0);
        }
        50%{
        transform:translateY(-10px);
        }
    }

    .temp{
        font-size:60px;
        font-weight:700;
    }

    .city{
        font-size:30px;
        margin-top:5px;
    }

    .condition{
        margin-top:5px;
        font-size:18px;
        color:#f1f1f1;
    }

/* Details */

    .details{
        margin-top:25px;
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:15px;
    }

    .card{
        background:rgba(255,255,255,0.15);
        padding:15px;
        border-radius:20px;
        transition:0.3s;
    }

    .card:hover{
        transform:translateY(-5px);
        background:rgba(255,255,255,0.25);
    }

    .card h3{
        font-size:15px;
        margin-bottom:5px;
    }

    .card p{
        font-size:20px;
        font-weight:600;
    }

/* Loader */

    .loading{
        display:none;
        margin-top:20px;
    }

    .loader{
        width:50px;
        height:50px;
        border:5px solid rgba(255,255,255,0.2);
        border-top:5px solid white;
        border-radius:50%;
        margin:auto;
        animation:spin 1s linear infinite;
    }

    @keyframes spin{
    100%{
        transform:rotate(360deg);
    }
    }

    .error{
        margin-top:15px;
        color:#ffb3b3;
    }

/* Responsive */

    @media(max-width:450px){

        .container{
            width:90%;
            padding:20px;
        }

        .temp{
            font-size:50px;
        }
    }

</style>
</head>

<body>

<div class="container">

    <div class="title">Weather App</div>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
    </div>

    <div class="loading" id="loading">
        <div class="loader"></div>
    </div>

    <img 
    src="https://openweathermap.org/img/wn/01d@2x.png"
    class="weather-icon"
    id="weatherIcon"
    >

    <div class="temp" id="temp">--°C</div>

    <div class="city" id="city">Search City</div>

    <div class="condition" id="condition">Weather Condition</div>

    <div class="details">

        <div class="card">
            <h3>Humidity</h3>
            <p id="humidity">--%</p>
        </div>

        <div class="card">
            <h3>Wind Speed</h3>
            <p id="wind">-- km/h</p>
        </div>

        <div class="card">
            <h3>Feels Like</h3>
            <p id="feels">--°C</p>
        </div>

        <div class="card">
            <h3>Pressure</h3>
            <p id="pressure">-- hPa</p>
        </div>

    </div>

    <div class="error" id="error"></div>

</div>

<script>

/* =========================
   OpenWeatherMap API Key
========================= */

const apiKey = "7baedf95c394f45accb45ff5053d8092";

/* =========================
   Get Weather Function
========================= */

async function getWeather(){

    const city = document.getElementById("cityInput").value;

    const loading = document.getElementById("loading");

    const error = document.getElementById("error");

    error.innerHTML = "";

    if(city === ""){

        error.innerHTML = "Please enter a city name";
        return;

    }

    loading.style.display = "block";

    try{

        const response = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
        );

        const data = await response.json();

        loading.style.display = "none";

        if(data.cod == 404){

            error.innerHTML = "City not found";
            return;

        }

        /* Temperature */

        document.getElementById("temp").innerHTML =
        Math.round(data.main.temp) + "°C";

        /* City */

        document.getElementById("city").innerHTML =
        data.name;

        /* Weather Condition */

        document.getElementById("condition").innerHTML =
        data.weather[0].main;

        /* Humidity */

        document.getElementById("humidity").innerHTML =
        data.main.humidity + "%";

        /* Wind Speed */

        document.getElementById("wind").innerHTML =
        data.wind.speed + " km/h";

        /* Feels Like */

        document.getElementById("feels").innerHTML =
        Math.round(data.main.feels_like) + "°C";

        /* Pressure */

        document.getElementById("pressure").innerHTML =
        data.main.pressure + " hPa";

        /* Weather Icon */

        const iconCode = data.weather[0].icon;

        document.getElementById("weatherIcon").src =
        `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

        /* Change Background */

        changeBackground(data.weather[0].main);

    }

    catch(error){

        loading.style.display = "none";

        document.getElementById("error").innerHTML =
        "Something went wrong";

    }

}

/* =========================
   Dynamic Background
========================= */

function changeBackground(weather){

    if(weather === "Clear"){

        document.body.style.background =
        "linear-gradient(135deg,#f6d365,#fda085)";

    }

    else if(weather === "Clouds"){

        document.body.style.background =
        "linear-gradient(135deg,#757F9A,#D7DDE8)";

    }

    else if(weather === "Rain"){

        document.body.style.background =
        "linear-gradient(135deg,#4B79A1,#283E51)";

    }

    else if(weather === "Thunderstorm"){

        document.body.style.background =
        "linear-gradient(135deg,#141E30,#243B55)";

    }

    else if(weather === "Snow"){

        document.body.style.background =
        "linear-gradient(135deg,#E6DADA,#274046)";

    }

    else{

        document.body.style.background =
        "linear-gradient(135deg,#1e3c72,#2a5298)";

    }

}

</script>

</body>
</html>
